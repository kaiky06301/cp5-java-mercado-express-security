<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Produtos')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <h2>📦 Produtos do Mercado</h2>
        <a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/produtos/novo}">➕ Novo produto</a>
    </div>
    <div th:replace="~{fragments :: alertas}"></div>
    <form th:action="@{/produtos}" method="get" style="display:flex;gap:8px;margin-bottom:14px;max-width:480px">
        <input name="busca" th:value="${busca}" placeholder="Consultar produto pelo nome...">
        <button type="submit">Consultar</button>
    </form>
    <div class="tabela-wrap">
    <table>
        <tr><th>ID</th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr>
        <tr th:each="p : ${produtos}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.nome}"></td>
            <td th:text="${p.categoria}"></td>
            <td th:text="${'R$ ' + #numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></td>
            <td th:text="${p.estoque}" th:style="${p.estoque < 10} ? 'color:#dc2626;font-weight:700' : ''"></td>
            <td class="acoes">
                <a class="btn btn-sec" th:href="@{/produtos/{id}(id=${p.id})}">Ver</a>
                <a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/produtos/{id}/editar(id=${p.id})}">Editar</a>
                <form sec:authorize="hasRole('ADMIN')" th:action="@{/produtos/{id}/excluir(id=${p.id})}" method="post"
                      onsubmit="return confirm('Excluir este produto?')">
                    <button class="btn-del" type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(produtos)}"><td colspan="6">Nenhum produto encontrado.</td></tr>
    </table>
    </div>
</main>
</body>
</html>
