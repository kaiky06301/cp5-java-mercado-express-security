<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Produto')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div class="card" style="max-width:560px">
        <h2 th:text="${produto.id == null} ? '➕ Novo produto' : '✏️ Editar produto'"></h2>
        <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" style="display:grid;gap:12px">
            <input type="hidden" th:field="*{id}">
            <label>Nome <input th:field="*{nome}"><span class="erro-campo" th:errors="*{nome}"></span></label>
            <label>Categoria <input th:field="*{categoria}" list="cats"><span class="erro-campo" th:errors="*{categoria}"></span></label>
            <datalist id="cats"><option>Hortifruti</option><option>Limpeza</option><option>Mercearia</option><option>Padaria</option><option>Vestuario</option></datalist>
            <label>Descrição <input th:field="*{descricao}"></label>
            <label>Preço (R$) <input type="number" step="0.01" th:field="*{preco}" style="width:100%"><span class="erro-campo" th:errors="*{preco}"></span></label>
            <label>Estoque <input type="number" th:field="*{estoque}" style="width:100%"><span class="erro-campo" th:errors="*{estoque}"></span></label>
            <div class="acoes">
                <button type="submit">Salvar</button>
                <a class="btn btn-sec" th:href="@{/produtos}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
