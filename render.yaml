# Blueprint do Render (plano free): PostgreSQL + Web Service Docker
# No Render: New + > Blueprint > escolher este repositorio > Apply
databases:
  - name: mercado-express-db
    plan: free
    databaseName: mercado
    user: mercado

services:
  - type: web
    name: mercado-express-security
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase: { name: mercado-express-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: mercado-express-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: mercado-express-db, property: database }
      - key: DB_USER
        fromDatabase: { name: mercado-express-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: mercado-express-db, property: password }
